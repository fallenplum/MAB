name: Apply reviewed research branch renames

# One-time migration for the user's 2026-11-18 repository organization request.
# Remove this workflow after the remote branch names and all SHAs are verified.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-branch-names.yml
      - reproducibility/branch_migration.json
      - scripts/migrate_branch_names.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: mab-reviewed-branch-renames-20261118
  cancel-in-progress: false

jobs:
  rename-reviewed-branches:
    if: github.repository == 'fallenplum/MAB' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify frozen archive before changing branch names
        run: python3 scripts/verify_repository.py
      - name: Check migration collision and failure handling with local mocks
        run: python3 -m unittest discover -s tests -p test_migrate_branch_names.py
      - name: Rename only the reviewed branch names and verify their commits
        run: python3 scripts/migrate_branch_names.py --apply
        env:
          GH_TOKEN: ${{ github.token }}
