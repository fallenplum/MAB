name: Verify paper archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify frozen bytes and reconstruct archived tables
        run: python3 scripts/verify_repository.py
      - name: Check reviewed migration failure handling without API calls
        run: python3 -m unittest discover -s tests -p test_migrate_branch_names.py
