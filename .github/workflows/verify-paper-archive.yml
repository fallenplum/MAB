name: Recompute E24
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e24:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: routing_idea2/paper_materials/e24_acl_v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-offline.txt
      - name: Check the frozen E24 result
        run: |
          python -B scripts/recompute_e24.py --sufficient data/e24_stratum_sufficient_statistics.csv > "$RUNNER_TEMP/e24.json"
          python - "$RUNNER_TEMP/e24.json" <<'PY'
          import json
          import math
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              actual = json.load(stream)
          assert actual["questions"] == 1196
          assert actual["question_seed_records"] == 3588
          rates = {
              "B_U": 86.46468620893172,
              "B_P": 87.62541806020067,
              "C_U": 87.65328874024527,
              "C_P": 87.65328874024527,
          }
          for policy, expected in rates.items():
              assert math.isclose(actual["accuracies_pct"][policy], expected, rel_tol=0, abs_tol=1e-9), policy
          assert math.isclose(actual["interaction_pp"], 1.160731851268935, rel_tol=0, abs_tol=1e-9)
          assert math.isclose(actual["p_value_two_sided"], 0.00008863968911154078, rel_tol=0, abs_tol=1e-10)
          assert math.isclose(actual["degrees_of_freedom"], 462.39419350835306, rel_tol=0, abs_tol=1e-8)
          assert actual["strict_switch"] == 145
          PY
