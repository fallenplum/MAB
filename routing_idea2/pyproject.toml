[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgeted-model-combination-routing"
version = "0.1.0"
description = "Frozen language-model team selection with budgeted final-output feedback"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "scikit-learn>=1.2", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
