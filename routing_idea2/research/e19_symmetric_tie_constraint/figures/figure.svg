<polyline id="history_b" points="1120,340 1290,340" fill="none" stroke="#225E8F" stroke-width="2" marker-end="url(#arrow)"/>
<polyline id="theory_b" points="1120,700 1290,700" fill="none" stroke="#225E8F" stroke-width="2" marker-end="url(#arrow)"/>
<polyline id="pilot_a" points="240,1000 240,980 1115,980 1115,1000" fill="none" stroke="#225E8F" stroke-width="2" marker-end="url(#arrow)"/>
<polyline id="pilot_b" points="820,1085 950,1085" fill="none" stroke="#225E8F" stroke-width="2" marker-end="url(#arrow)"/>
<polyline id="pilot_c" points="1280,1085 1410,1085" fill="none" stroke="#225E8F" stroke-width="2" marker-end="url(#arrow)"/>
<text id="title" x="60" y="55.5" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#162B43">From tied rewards to training constraints</text>
<text id="setting" x="60" y="109.5" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#506276">Six frozen models  |  20 three-member teams  |  Fixed cached feedback  |  Shared linear head</text>
<text id="history_header" x="90" y="200.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#225E8F">Historical evidence separates behavior and quality</text>
<text id="renumber_title" x="305.0" y="281.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#162B43">E17 champion intervention</text>
<text id="renumber_line0" x="305.0" y="324.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">100 renumberings on 600 items</text>
<text id="renumber_line1" x="305.0" y="355.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">SPO team agreement 6.135%</text>
<text id="renumber_line2" x="305.0" y="386.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">Ridge / uniform TSPO 100%</text>
<text id="symmetry_title" x="905.0" y="281.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#162B43">E17 inference control</text>
<text id="symmetry_line0" x="905.0" y="324.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">TSPO 397 / 600 near ties</text>
<text id="symmetry_line1" x="905.0" y="355.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">Semantic priority 100% agreement</text>
<text id="symmetry_line2" x="905.0" y="386.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">Numeric near-tie priority 37.308%</text>
<text id="quality_title" x="1500.0" y="281.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#162B43">E18 frozen quality evaluation</text>
<text id="quality_line0" x="1500.0" y="324.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">2,998 scorable / 3,000 requested</text>
<text id="quality_line1" x="1500.0" y="355.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">TSPO − SPO +0.01175 pp</text>
<text id="quality_line2" x="1500.0" y="386.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">Corrected 377 / damaged 376</text>
<text id="history_scope" x="900.0" y="459.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">E18.1 marginal 95% interval [−0.667,+0.690] pp; post-result supplement on the frozen evaluation.</text>
<text id="theory_header" x="90" y="560.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#225E8F">Two constructions give different falsifiable predictions</text>
<text id="a1_title" x="305.0" y="641.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#162B43">A1 finite repeated feedback</text>
<text id="a1_line0" x="305.0" y="684.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">t=(1−a)^L</text>
<text id="a1_line1" x="305.0" y="715.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">d*=0 exactly when tp ≥ 1−t</text>
<text id="a1_line2" x="305.0" y="746.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">Fixed L retains the same target risk</text>
<text id="a2_title" x="905.0" y="641.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#162B43">A2 symmetric constraint strength</text>
<text id="a2_line0" x="905.0" y="684.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">T truly tied; shared parameters</text>
<text id="a2_line1" x="905.0" y="715.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">d_X2=(−46+51β)/600</text>
<text id="a2_line2" x="905.0" y="746.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">Strict decision crosses at 46/51</text>
<text id="boundary_title" x="1500.0" y="641.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#162B43">Explicit construction boundary</text>
<text id="boundary_line0" x="1500.0" y="684.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">λ=60 belongs to this 3D example</text>
<text id="boundary_line1" x="1500.0" y="715.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">Reward 1 → 0.95 at tie → 0.9</text>
<text id="boundary_line2" x="1500.0" y="746.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">Real W penalty inherited by fold</text>
<text id="theory_scope" x="900.0" y="829.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">Directional champion preference and direction-neutral score contraction are distinct mechanisms.</text>
<text id="pilot_header" x="90" y="930.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#225E8F">E19 isolates the fully tied-row term with γ=0</text>
<text id="b_title" x="240.0" y="1031.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#162B43">B retains constraint</text>
<text id="b_line0" x="240.0" y="1074.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">β=1</text>
<text id="b_line1" x="240.0" y="1105.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">Uniform empirical champions</text>
<text id="b_line2" x="240.0" y="1136.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">Original denominator N=480</text>
<text id="c_title" x="670.0" y="1031.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#162B43">C disables tied-row term</text>
<text id="c_line0" x="670.0" y="1074.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">β=0</text>
<text id="c_line1" x="670.0" y="1105.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">Same labels on all other rows</text>
<text id="c_line2" x="670.0" y="1136.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">Same original L2, including bias</text>
<text id="qualification_title" x="1115.0" y="1031.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#162B43">P0 implementation gate</text>
<text id="qualification_line0" x="1115.0" y="1074.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">4 fits; all checks PASS</text>
<text id="qualification_line1" x="1115.0" y="1105.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">Mapped policy error 0</text>
<text id="qualification_line2" x="1115.0" y="1136.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">0.02715 ≤ 0.10913</text>
<text id="results_title" x="1560.0" y="1031.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#162B43">P1 uniform τ=1e−8</text>
<text id="results_line0" x="1560.0" y="1074.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">150 strict changes / 600</text>
<text id="results_line1" x="1560.0" y="1105.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">C−B +1.442 pp</text>
<text id="results_line2" x="1560.0" y="1136.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#506276">95% CI [0.191, 2.722] pp</text>
<text id="endpoint_compare" x="455.0" y="1085.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#162B43">versus</text>
<text id="pilot_formula" x="900.0" y="1207.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#162B43">Strict-change contribution +1.056 pp (38 corrected / 19 damaged); numerical-tie region +0.386 pp</text>
<text id="raw_sensitivity" x="900.0" y="1244.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#506276">Raw exact-argmax diagnostic +1.000 pp, 95% CI [−0.333,+2.333] pp; the numerical service definition matters.</text>
<text id="scope" x="900.0" y="1317.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#162B43">P0 + P1 completed with 10 main and 2 mapping fits on train600 OOF development; additional LLM calls 0.</text>
<text id="footer" x="900.0" y="1360.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#506276">Independent-confirmation design remains a later stage under a separate frozen protocol.</text>
</svg>
